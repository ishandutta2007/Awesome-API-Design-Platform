<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(45px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
      }
      .floating-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .glowing-orb {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .streaming-path {
        stroke-dasharray: 8, 8;
        animation: dashMove 3s linear infinite;
      }
      .orbiting-node {
        animation: orbit 10s linear infinite;
        transform-origin: 1010px 180px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Backdrops -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" filter="url(#blurFilter)" class="glowing-orb" opacity="0.3" />
  <circle cx="1020" cy="240" r="150" fill="#7c3aed" filter="url(#blurFilter)" class="glowing-orb" opacity="0.25" />
  <circle cx="600" cy="180" r="180" fill="#0f766e" filter="url(#blurFilter)" class="glowing-orb" opacity="0.15" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Decorative Corner Lines & Accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 30 310 L 30 330 L 50 330" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <path d="M 1170 310 L 1170 330 L 1150 330" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>

  <!-- Left / Main Header Content -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" fill="#e2e8f0" class="pill-text">CURATED REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" font-size="44" fill="url(#accentGrad1)" class="title-text" filter="url(#glowFilter)">
        Awesome API Design Platform
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" font-size="18" fill="#94a3b8" class="subtitle-text">
        Top OpenAPI Editors • API Mocking • Interactive Docs • Testing &amp; Governance
      </text>
    </g>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 218)">
      <!-- OpenAPI Badge -->
      <g transform="translate(0, 0)">
        <rect width="126" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#6ee7b7" />
        <text x="30" y="22" font-size="13" font-weight="700" fill="#f1f5f9" font-family="system-ui">OpenAPI v3</text>
      </g>
      <!-- AsyncAPI Badge -->
      <g transform="translate(138, 0)">
        <rect width="126" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#38bdf8" />
        <text x="30" y="22" font-size="13" font-weight="700" fill="#f1f5f9" font-family="system-ui">AsyncAPI</text>
      </g>
      <!-- GraphQL Badge -->
      <g transform="translate(276, 0)">
        <rect width="120" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#f43f5e" />
        <text x="30" y="22" font-size="13" font-weight="700" fill="#f1f5f9" font-family="system-ui">GraphQL</text>
      </g>
      <!-- Mock & Test Badge -->
      <g transform="translate(408, 0)">
        <rect width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#fbbf24" />
        <text x="30" y="22" font-size="13" font-weight="700" fill="#f1f5f9" font-family="system-ui">Mock &amp; Testing</text>
      </g>
      <!-- Open Source Badge -->
      <g transform="translate(570, 0)">
        <rect width="144" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#c084fc" />
        <text x="30" y="22" font-size="13" font-weight="700" fill="#f1f5f9" font-family="system-ui">100% FOSS Stacks</text>
      </g>
    </g>

    <!-- Footer Stats / Feature Row -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-size="13" fill="#64748b" font-family="system-ui">
        ✦ REST, gRPC, Protobuf, AsyncAPI &amp; GraphQL Architectures &bull; Self-Hosted &amp; Commercial Solutions
      </text>
    </g>
  </g>

  <!-- Right Visual / Animated API Diagram Graphic -->
  <g class="floating-group">
    <!-- Connecting animated circuit lines -->
    <path d="M 850 180 L 930 130 L 1010 180 L 1090 130" fill="none" stroke="#38bdf8" stroke-width="2" class="streaming-path" opacity="0.6" />
    <path d="M 850 180 L 930 230 L 1010 180 L 1090 230" fill="none" stroke="#c084fc" stroke-width="2" class="streaming-path" opacity="0.6" />

    <!-- Center Node / Hub (OpenAPI Core) -->
    <g transform="translate(1010, 180)">
      <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="url(#accentGrad1)" stroke-width="3" filter="url(#glowFilter)" />
      <!-- Inner Icon / API Contract Hexagon -->
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#38bdf8" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="5" font-size="12" font-weight="900" fill="#ffffff" font-family="monospace" text-anchor="middle">API</text>
    </g>

    <!-- Node 1: Design (Top Left) -->
    <g transform="translate(930, 130)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#38bdf8" font-family="system-ui" text-anchor="middle">SPEC</text>
    </g>

    <!-- Node 2: Mock (Bottom Left) -->
    <g transform="translate(930, 230)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#fbbf24" font-family="system-ui" text-anchor="middle">MOCK</text>
    </g>

    <!-- Node 3: Docs (Top Right) -->
    <g transform="translate(1090, 130)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#34d399" font-family="system-ui" text-anchor="middle">DOCS</text>
    </g>

    <!-- Node 4: SDK (Bottom Right) -->
    <g transform="translate(1090, 230)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#c084fc" font-family="system-ui" text-anchor="middle">SDK</text>
    </g>

    <!-- Orbiting Satellite Node -->
    <circle cx="1010" cy="180" r="6" fill="#38bdf8" class="orbiting-node" filter="url(#glowFilter)" />
  </g>
</svg>
